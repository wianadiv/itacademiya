<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌱 Мониторинг роста растений</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .card h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.3em;
        }
        .stat-value {
            font-size: 3em;
            font-weight: bold;
            color: #764ba2;
            text-align: center;
            margin: 20px 0;
        }
        .stat-label {
            text-align: center;
            color: #666;
            font-size: 1.1em;
        }
        .status {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: bold;
        }
        .status.ok { background: #10b981; color: white; }
        .status.error { background: #ef4444; color: white; }
        .image-container {
            text-align: center;
            margin-top: 15px;
        }
        .image-container img {
            max-width: 100%;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .chart-container {
            position: relative;
            height: 300px;
            margin-top: 20px;
        }
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }
        .info-item {
            background: #f3f4f6;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }
        .info-item label {
            display: block;
            font-size: 0.85em;
            color: #666;
            margin-bottom: 5px;
        }
        .info-item value {
            font-size: 1.2em;
            font-weight: bold;
            color: #764ba2;
        }
        .timestamp {
            text-align: center;
            color: white;
            margin-top: 20px;
            font-size: 0.9em;
            opacity: 0.9;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        .updating {
            animation: pulse 2s infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌱 Мониторинг роста растений</h1>
        
        <div class="dashboard">
            
            <div class="card">
                <h2>📏 Текущая высота</h2>
                <div class="stat-value" id="currentHeight">--</div>
                <div class="stat-label">сантиметров</div>
                <div class="info-grid">
                    <div class="info-item">
                        <label>Пиксели растения</label>
                        <value id="plantPx">--</value>
                    </div>
                    <div class="info-item">
                        <label>Пиксели карандаша</label>
                        <value id="pencilPx">--</value>
                    </div>
                </div>
            </div>

            
            <div class="card">
                <h2>💡 Статус системы</h2>
                <div style="text-align: center; margin: 20px 0;">
                    <span class="status" id="calibStatus">Проверка...</span>
                </div>
                <div class="info-grid">
                    <div class="info-item">
                        <label>Масштаб (px/cm)</label>
                        <value id="pxPerCm">--</value>
                    </div>
                    <div class="info-item">
                        <label>Всего измерений</label>
                        <value id="totalMeas">--</value>
                    </div>
                </div>
                <div class="image-container">
                    <img id="liveImage" src="/api/image" alt="Last capture" style="display:none;">
                    <p id="noImage" style="color:#999; margin-top:10px;">Изображений пока нет</p>
                </div>
            </div>

            
            <div class="card">
                <h2>🕐 Последнее измерение</h2>
                <div class="stat-value" id="lastHeight">--</div>
                <div class="stat-label" id="lastTime">--</div>
            </div>
        </div>

        
        <div class="card">
            <h2>📈 График роста</h2>
            <div class="chart-container">
                <canvas id="growthChart"></canvas>
            </div>
        </div>

        <div class="timestamp" id="lastUpdate">Обновление...</div>
    </div>

    <script>
        let growthChart = null;

        function initChart() {
            const ctx = document.getElementById('growthChart').getContext('2d');
            growthChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'Высота растения (см)',
                        data: [],
                        borderColor: '#764ba2',
                        backgroundColor: 'rgba(118, 75, 162, 0.1)',
                        borderWidth: 3,
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: true }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            title: { display: true, text: 'Высота (см)' }
                        },
                        x: {
                            title: { display: true, text: 'Время' }
                        }
                    }
                }
            });
        }

        async function updateData() {
            try {

                const statusResp = await fetch('/api/status');
                const status = await statusResp.json();

                document.getElementById('calibStatus').textContent =
                    status.calibrated ? '✅ Калибровано' : '⚠️ Ожидание калибровки';
                document.getElementById('calibStatus').className =
                    'status ' + (status.calibrated ? 'ok' : 'error');
                document.getElementById('pxPerCm').textContent =
                    status.px_per_cm ? status.px_per_cm.toFixed(2) : '--';
                document.getElementById('totalMeas').textContent = status.total_measurements || 0;

                if (status.latest_measurement) {
                    const last = status.latest_measurement;
                    document.getElementById('currentHeight').textContent =
                        parseFloat(last.height_cm).toFixed(2);
                    document.getElementById('lastHeight').textContent =
                        parseFloat(last.height_cm).toFixed(2);
                    document.getElementById('lastTime').textContent = last.timestamp;
                    document.getElementById('plantPx').textContent = last.plant_pixels || '--';
                    document.getElementById('pencilPx').textContent = last.pencil_pixels || '--';
                }

                const img = document.getElementById('liveImage');
                const noImg = document.getElementById('noImage');
                img.src = '/api/image?' + Date.now();
                img.onload = () => {
                    img.style.display = 'inline-block';
                    noImg.style.display = 'none';
                };
                img.onerror = () => {
                    img.style.display = 'none';
                    noImg.style.display = 'block';
                };

                const historyResp = await fetch('/api/history');
                const history = await historyResp.json();

                if (growthChart && history.length > 0) {
                    growthChart.data.labels = history.map(h => {
                        const d = new Date(h.timestamp);
                        return d.toLocaleTimeString('ru-RU', {hour: '2-digit', minute:'2-digit'});
                    });
                    growthChart.data.datasets[0].data = history.map(h => h.height_cm);
                    growthChart.update();
                }

                document.getElementById('lastUpdate').textContent =
                    'Обновлено: ' + new Date().toLocaleTimeString('ru-RU');

            } catch (error) {
                console.error('Ошибка обновления:', error);
                document.getElementById('lastUpdate').textContent = 'Ошибка соединения';
            }
        }

        window.onload = () => {
            initChart();
            updateData();
            setInterval(updateData, 5000);
        };
</script>
</body>
</html>
